<div class="cliente-layout">
  <!-- Botón hamburguesa -->
  <button class="sidebar-toggle" (click)="toggleSidebar()">
  <span class="car-track" [class.open]="isSidebarOpen">
    <span class="track"></span>
    <span class="car">&#128663;</span>
  </span>
</button>
  <!-- Sidebar expandible -->
  <nav class="sidebar" [class.closed]="!isSidebarOpen">
    <ul class="sidebar-menu">
      <li><a routerLink="/cliente/perfil" routerLinkActive="active"><span class="icon">👤</span><span class="text">Mi Perfil</span></a></li>
      <li><a routerLink="/cliente/reservar-servicio" routerLinkActive="active"><span class="icon">🛠️</span><span class="text">Reservar Servicio</span></a></li>
      <li><a routerLink="/cliente/historial" routerLinkActive="active"><span class="icon">📜</span><span class="text">Historial</span></a></li>
    </ul>
  </nav>

  <!-- Main content with header -->
  <div class="main-panel">
    <header class="private-header">
      <div class="header-logo-user">
        <img class="header-logo" src="/img/logo.png" alt="Logo" />
        <div class="user-info">
          <img class="avatar" src="/img/avatar-user.svg" alt="Avatar" />
          <span class="username">{{ usuario?.nombre || 'Cliente' }} {{ usuario?.apellido || 'Sistema' }}</span>
          <div class="dropdown">
            <button type="button" class="dropdown-toggle" (click)="toggleDropdown($event)">
              ▼
            </button>
            <div class="dropdown-menu" [style.display]="showDropdown ? 'block' : 'none'">
              <a href="#" (click)="logout(); $event.preventDefault()">
                🚪 Cerrar sesión
              </a>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div class="main-content-area">
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
